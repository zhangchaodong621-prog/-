# 三池分类规则（可按需增删关键词）
#
# 说明：
# - keywords 会对“行业/概念/标签”等文本字段做包含匹配（大小写不敏感）
# - overrides 的优先级最高：把股票代码强行归类到某个池

pools:
  tech_pool:
    name: "科技成长池"
    keywords:
      - "半导体"
      - "芯片"
      - "算力"
      - "人工智能"
      - "AI"
      - "软件"
      - "通信"
      - "通信技术"
      - "高端硬件"
      - "机器人"
      - "自主可控"
      - "国产替代"
      - "信创"
  value_pool:
    name: "红利防御池"
    keywords:
      - "银行"
      - "电力"
      - "高速公路"
      - "公用事业"
      - "石化"
      - "煤炭"
      - "国企"
      - "央企"
      - "大基建"
      - "建筑"
      - "基建"
  speculation_pool:
    name: "题材博弈池"
    keywords:
      - "小金属"
      - "黄金"
      - "铜"
      - "铅"
      - "稀土"
      - "有色"
      - "大宗"
      - "原材料"
      - "白酒"
      - "农产品"
      - "重组"
      - "ST"
      - "摘帽"

overrides:
  # 示例：
  # "600519": "speculation_pool"   # 贵州茅台 -> 题材博弈池（仅示例，按你的口径改）

behavior:
  # 非交易日是否仍推送一条提示
  notify_on_non_trading_day: false

